<!DOCTYPE html>
<html>
<head>
    <style>
        table { border-collapse: collapse; width: 100%; font-size: 12px; }
        th, td { border: 1px solid #000; padding: 5px; text-align: left; }
        th { background: #ddd; }
    </style>
</head>
<body>
    <h2>Timetable - {{ section.name }}</h2>
    <table>
        <tr>
            <th>Day</th><th>Period</th><th>Time</th><th>Subject</th><th>Teacher</th><th>Classroom</th>
        </tr>
        {% for e in entries %}
        <tr>
            <td>{{ e.get_day_display }}</td>
            <td>{{ e.period }}</td>
            <td>{{ PERIOD_TIMINGS|get_item:e.period }}</td>
            <td>{{ e.subject.name }}</td>
            <td>{{ e.teacher.name }}</td>
            <td>{{ e.classroom.name }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
